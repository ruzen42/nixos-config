# ~/.config/fuzzel/fuzzel.ini

font=Terminus:size=11
dpi-aware=auto
icon-theme=Everforest-Dark
show-actions=no
terminal=alacritty

lines=12
width=40
tabs=4
horizontal-pad=24
vertical-pad=18
inner-pad=12

image-size-ratio=0.5
line-height=26

[colors]
background=1D0515FF
text=d3c6aaff
match=f75c7bff
selection=990022ff
selection-text=ff8a9eff
selection-match=ff2a55ff
border=f75c7bff

[border]
width=1
radius=2

[dmenu]
mode=text
exit-immediately-if-empty=no
